[plugins."miumiupy98-art/weread.koplugin-fixed"]
categories = ["content", "notes"]
purpose = "Enhanced fork of QiuYukang/weread.koplugin for browsing, downloading and reading WeChat Reading books and official-account articles. Adds in-plugin QR login, saved credentials, EPUB export either clean or carrying highlights and thoughts, and manual OTA updates."
