# --- written in English for plugins that document themselves in Chinese.
# --- Ranking tokenises on [a-z0-9]+, so these entries scored zero against
# --- every query in any language and reached nobody. The rules now read a
# --- translated README where a repository publishes one; these seven do not,
# --- and they are the head of that tail -- 595, 115 and 44 stars among them.
# --- Purpose only, and only what the README states. Tier is a judgement about
# --- a plugin, not about its documentation, so it is left where the rules put
# --- it: reading a README is not the same as having used the thing.

[plugins."finlater/weread.koplugin"]
categories = ["content", "sync"]
purpose = "Read WeChat Reading (微信读书) books and official-account articles inside KOReader, with reading progress and reading time synced back to the account, and reviews, highlights and thoughts visible on the page. Brings the service to closed devices like Kindle and Kobo."
keywords = ["weread", "wechat reading", "weixin", "chinese ebooks", "official accounts", "progress sync", "reading time"]
note = "Unofficial client for a third-party service. The README states it is for personal study and warns that account bans are the user's own risk."

[plugins."hesan1232/fanqie.koplugin"]
categories = ["content"]
purpose = "Read Fanqie (番茄小说) web novels on an e-ink device: QR-code login, bookshelf, chapter navigation, progress synced to the server, chapter pre-download and offline reading of what is cached."
keywords = ["fanqie", "web novels", "chinese novels", "webnovel", "offline reading", "progress sync"]
note = "Unofficial. Falls back across three content sources, two of which are third-party aggregators rather than the official API."

[plugins."Merpyzf/pinyinime.koplugin"]
categories = ["dict", "ui"]
purpose = "Pinyin input method for KOReader's built-in Simplified Chinese keyboard: a candidate bar, whole-sentence input, full pinyin and five double-pinyin schemes, and personalised learning. An enhancement layer over the existing keyboard rather than a replacement, and it works entirely offline."
