categories = ["reading"]
purpose = "Finds the panels on a comic or manga page as you read it and shows them one at a time, masking the rest. Nothing is prepared in advance -- it analyses the page on the fly -- and it reads either direction, with a long press for free zoom."
keywords = ["panel zoom", "comic", "manga", "panels", "detection"]

[plugins."qewer33/quickrss.koplugin"]
categories = ["web"]
purpose = "Standalone RSS reader for KOReader: a paginated list of thumbnail cards with read and unread tracking, articles rendered by KOReader's own HTML engine, images cached ahead of time, and full text pulled in for feeds that publish only a summary."
keywords = ["rss", "feeds", "news", "articles", "offline", "thumbnails"]

[plugins."FadedSwatz/quickrss.koplugin"]
categories = ["web"]
purpose = "Presents itself as a fast, standalone RSS reader for KOReader, but its README is written for a Windows desktop program: system requirements, an executable to double-click, and troubleshooting for when it will not start."
keywords = ["rss", "feeds", "articles", "quickrss"]
note = "Unrelated to qewer33/quickrss.koplugin despite carrying the same name and the same one-line description. Every download link in its README points at a zip committed inside the repository rather than at a release, and the instructions tell the reader to run an executable and to disable antivirus if it is blocked. Treat it with caution."

[plugins."flip-rossi/readeck.koplugin"]
categories = ["web"]
purpose = "Talks to your own Readeck server's API from KOReader: browse bookmarks and collections, and add a bookmark by tapping a link while you read, with default labels of your choosing."
keywords = ["readeck", "read later", "bookmarks", "self-hosted", "articles"]
note = "Its README describes the plugin as early development that may not always work as expected."

[plugins."omer-faruq/instapaper.koplugin"]
categories = ["web"]
purpose = "Read an Instapaper account in KOReader: browse unread, starred, archived and custom folders, download articles as HTML or as EPUB with images, a cover and a table of contents built from the headings, and archive, star or delete them from the list."
keywords = ["instapaper", "read later", "articles", "epub", "download"]

[plugins."artemartemenko/KOReader_MultiUser.koplugin"]
categories = ["misc"]
purpose = "Isolated user profiles on one KOReader install: each profile keeps its own settings, reading history, plugins and patches, and -- as long as each person keeps their books in a separate folder -- its own positions and bookmarks. Ships as a plugin and a patch together."
keywords = ["multi user", "profiles", "shared device", "settings", "history"]

[plugins."Evgeniy-94/TelegramDownloader.koplugin"]
categories = ["files"]
purpose = "Gets files onto the e-reader through a Telegram bot of your own: message the bot a document and download it from KOReader into a folder you choose."
keywords = ["telegram", "download", "transfer", "files", "bot"]


# -------------------------------------------------------------------- glossary
#
# Concept words, Chinese to English, appended to the keywords of any entry whose
# own text is Chinese. Not a translation: keywords are labels, and this never
# writes prose or touches a purpose.
#
# Deliberately short, and deliberately not the frequent words. Counting terms
# across the plugins that need this put 插件 (plugin), 安装 (install), 目录
# (directory), 重启 (restart) and 许可证 (licence) at the top -- every README has
# them, none of them tells a reader what a plugin does, and translating them
# would fill the highest-weighted field in the index with noise. What earns a
# line here is a word that says what the thing *is*, which is rarer per README
# and shared across the ones that matter.
#
# Add a line when a Chinese-documented plugin turns up doing something this
# list cannot name. Do not add product names that already appear in Latin in
# the repository name -- weread, fanqie, legado and pixiv are all findable
# already; what is missing is what they are, not what they are called.

