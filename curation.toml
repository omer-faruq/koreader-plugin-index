# ---------------------------------------------------------------- distinctions
#
# Pairs that look interchangeable and are not.
#
# Write these as plain description, for a person deciding between the two. They
# are shown in the UI as well as copied into the generated knowledge base, and
# instructions aimed at a model ("do not describe them as...") read badly to a
# reader. The rules a model needs belong in the knowledge base preamble; what
# belongs here is the fact that distinguishes them.

[[distinctions]]
between = ["gitalexcampos/highlightsync.koplugin", "dani84bs/AnnotationSync.koplugin"]
say = "Both synchronise annotations, and they are not interchangeable. Which one fits depends on the sync service you already use."

[[distinctions]]
between = ["omer-faruq/assistant.koplugin", "zeeyado/koassistant.koplugin"]
say = "Related projects in the same ecosystem, but separate repositories with separate authors and features."

[[distinctions]]
between = ["omer-faruq/webbrowser.koplugin", "iceyear/readeck.koplugin"]
say = "The browser searches and reads pages directly. Readeck is an integration with a Readeck server you already run, so it is a read-later workflow rather than a browser."

[[distinctions]]
between = ["omer-faruq/simpleui_ext.koplugin", "doctorhetfield-cmd/simpleui.koplugin", "JoeBumm/Koreader-Menu-customizer", "AnthonyGress/zen_ui.koplugin", "Euphoriyy/appearance.koplugin"]
say = "SimpleUI Ext adds modules to SimpleUI and needs it installed. Menu Customizer hides entries from the menus you already have. Zen UI and Appearance change how KOReader looks without replacing the home screen. Different jobs, not competing versions of one."

[[distinctions]]
between = ["doctorhetfield-cmd/simpleui.koplugin", "AndyHazz/bookshelf.koplugin"]
say = "Both replace the home screen and you would install one, not both. SimpleUI is a whole minimal interface with its own navigation and status bars; Bookshelf is a library browser that leads with covers, series and progress."

[[distinctions]]
between = ["omer-faruq/appstore.koplugin", "ultimatejimmy/storefront.koplugin", "advokatb/updatesmanager.koplugin"]
say = "Three separate projects for installing and updating plugins from the device. AppStore and Storefront both browse and install; Updates Manager only tracks updates across repositories you name."

[[distinctions]]
between = ["ZlibraryKO/zlibrary.koplugin", "OctoNezd/zlibrary.koplugin"]
say = "Two independent Z-Library clients by different authors, not versions of one project."

[[distinctions]]
between = ["stradichenko/audiobook.koplugin", "naleo/audiobookshelf.koplugin"]
say = "Audiobook is read-along inside a book. Audiobookshelf connects to an Audiobookshelf server to browse and download. Different jobs that share a word."

[[distinctions]]
between = ["ultimatejimmy/xray.koplugin", "Arararararagi/charactertracker.koplugin"]
say = "Both follow characters through a book. X-Ray builds timelines and insights using an AI provider you supply; Character Tracker does not require one."

[[distinctions]]
between = ["KORComic/comicreader.koplugin", "tachibana-shin/rakuyomi"]
say = "Comic Reader improves how paged comics are displayed; Rakuyomi fetches manga from online sources. One is a reading experience, the other is where the content comes from."

[[distinctions]]
between = ["finlater/weread.koplugin", "miumiupy98-art/weread.koplugin-fixed", "Mr54233/pickthought.koplugin"]
say = "All three reach WeChat Reading and they do different jobs. finlater's reads the service inside KOReader with progress and reading time synced back. The -fixed fork descends from a different upstream and leads with exporting books to EPUB, optionally carrying highlights and thoughts. PickThought does not read the service at all: it takes highlights and public thoughts and injects them into an EPUB you already have."

[[distinctions]]
between = ["Merpyzf/pinyinime.koplugin", "zhouwt/pinyin.koplugin"]
say = "One word, opposite directions. Pinyin IME is for typing Chinese: it adds a candidate bar and sentence input to the keyboard. Pinyin for KOReader is for reading it: it prints pinyin above the characters on the page and types nothing."
