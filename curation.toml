# --- written in English for plugins that document themselves in Chinese.
# --- Ranking tokenises on [a-z0-9]+, so these entries scored zero against
# --- every query in any language and reached nobody. The rules now read a
# --- translated README where a repository publishes one; these seven do not,
# --- and they are the head of that tail -- 595, 115 and 44 stars among them.
# --- Purpose only, and only what the README states. Tier is a judgement about
# --- a plugin, not about its documentation, so it is left where the rules put
# --- it: reading a README is not the same as having used the thing.

[plugins."finlater/weread.koplugin"]
