# Hand-written judgement. The only file here a person edits.
#
# The generator merges this over everything it extracted; it never lets a
# rebuild overwrite what is written below. That is what makes regenerating the
# catalogue every night safe: the facts refresh, the judgement survives.
#
# What belongs here is exactly what a README cannot yield -- the distinctions
# between plugins that look alike, the cautions, the confirmations that
# something is worth recommending. Everything else the generator works out.
#
# Seeded from the hand-written AppStore knowledge base.
# Pull requests welcome: curation should not depend on one person.

# ---------------------------------------------------------------------- tier A

[plugins."omer-faruq/assistant.koplugin"]
tier = "A"
categories = ["ai", "dict"]
purpose = "AI assistant for KOReader: ask about highlighted text, translate, summarise and explain, across many providers."
keywords = ["chatgpt", "claude", "gemini", "deepseek", "ollama", "translation", "summary", "ai dictionary"]
note = "A client, not an AI service. Users must supply their own provider or a local model."

[plugins."omer-faruq/webbrowser.koplugin"]
tier = "A"
categories = ["web"]
purpose = "Text-oriented web browser for e-ink: search, open pages and read them in Markdown, CRE or MuPDF rendering."
keywords = ["browser", "search", "articles", "jina", "cre", "mupdf"]

[plugins."omer-faruq/simpleui_ext.koplugin"]
tier = "A"
categories = ["ui"]
purpose = "Extra home screen modules for SimpleUI, including Hero Currently Reading and recent book statistics."
keywords = ["simpleui", "homescreen", "currently reading", "stats"]

[plugins."zeeyado/koassistant.koplugin"]
tier = "A"
categories = ["ai"]

[plugins."tachibana-shin/rakuyomi"]
tier = "A"
categories = ["content"]
purpose = "Manga reader for KOReader: browse manga sources, download chapters and read them in KOReader itself, keeping track of what you have already read."

[plugins."OctoNezd/zlibrary.koplugin"]
tier = "A"
categories = ["content", "library"]
note = "Describes the repository's stated functionality only. Availability and legality vary by jurisdiction; do not advise on either."

[plugins."AnthonyGress/zen_ui.koplugin"]
tier = "A"
categories = ["ui"]
purpose = "Replaces KOReader's interface with a clean, minimal one, for readers who want the screen given over to the book rather than to controls."

[plugins."pengcw/legado.koplugin"]
tier = "A"
categories = ["content"]
purpose = "Read Legado online-library and web-novel content inside KOReader, reaching the sources a Legado setup provides without leaving the reader."

[plugins."Ajatt-Tools/anki.koplugin"]
tier = "A"
categories = ["dict"]
purpose = "Turns words looked up in KOReader's own dictionary into Anki cards through AnkiConnect, for building vocabulary from what you are actually reading."
keywords = ["ankiconnect", "flashcards", "vocabulary", "language learning"]

[plugins."gitalexcampos/highlightsync.koplugin"]
tier = "A"
categories = ["sync"]
purpose = "Synchronise highlights, notes and bookmarks between devices over WebDAV or Dropbox."

[plugins."kaikozlov/localsend.koplugin"]
tier = "A"
categories = ["files"]
purpose = "Send and receive files wirelessly with LocalSend, moving books and documents between an e-reader and a phone or computer on the same network without a cable."

[plugins."AndyHazz/bookends.koplugin"]
tier = "A"
categories = ["ui"]
purpose = "Configurable text overlays on the reading screen, built from tokens and icons with per-line styling and saved presets, for showing progress, time or anything else while reading."

[plugins."stelzch/zotero.koplugin"]
tier = "A"
categories = ["library"]
purpose = "Browse a Zotero library on an e-reader: open your collections and read the papers and documents in them through KOReader, for research and academic reading."
keywords = ["reference manager", "research", "academic"]

[plugins."OGKevin/kobo.koplugin"]
tier = "A"
categories = ["device"]
purpose = "Kobo-specific enhancements for KOReader, adding behaviour that only applies to Kobo hardware rather than changing KOReader generally."

[plugins."greywolf1499/opds_plus.koplugin"]
tier = "A"
categories = ["library"]
purpose = "Enhanced OPDS catalogue browser with cover display, grid and list views."
keywords = ["calibre", "catalog", "covers"]

[plugins."JoeBumm/Koreader-Menu-customizer"]
tier = "A"
categories = ["ui"]
purpose = "Hides individual menus and plugins from KOReader's interface, so the menus keep only what you actually use. Simplifies the existing interface rather than replacing it."

[plugins."dani84bs/AnnotationSync.koplugin"]
tier = "A"
categories = ["sync"]
purpose = "Synchronises KOReader annotations between devices, so highlights and notes made on one reader are present on the next one you pick up."

[plugins."iceyear/readeck.koplugin"]
tier = "A"
categories = ["web"]
purpose = "Reads articles saved to a Readeck server you run yourself, bringing a read-later queue onto the e-reader. Requires an existing Readeck instance."
keywords = ["read later", "save articles", "reading list"]

[plugins."mysticknits/pencil.koplugin"]
tier = "A"
categories = ["device", "ui"]
purpose = "Stylus support for handwritten notes in EPUBs, on the Kobo Libra Color specifically. Requires that hardware; it does nothing on devices without a pen."

# ---------------------------------------------------------------- distinctions
#
# Pairs that look interchangeable and are not.
#
# Write these as plain description, for a person deciding between the two. They
# are shown in the UI as well as copied into the generated knowledge base, and
# instructions aimed at a model ("do not describe them as...") read badly to a
# reader. The rules a model needs belong in the knowledge base preamble; what
# belongs here is the fact that distinguishes them.

[[distinctions]]
between = ["gitalexcampos/highlightsync.koplugin", "dani84bs/AnnotationSync.koplugin"]
say = "Both synchronise annotations, and they are not interchangeable. Which one fits depends on the sync service you already use."

[[distinctions]]
between = ["omer-faruq/assistant.koplugin", "zeeyado/koassistant.koplugin"]
say = "Related projects in the same ecosystem, but separate repositories with separate authors and features."

[[distinctions]]
between = ["omer-faruq/webbrowser.koplugin", "iceyear/readeck.koplugin"]
say = "The browser searches and reads pages directly. Readeck is an integration with a Readeck server you already run, so it is a read-later workflow rather than a browser."

[[distinctions]]
between = ["omer-faruq/simpleui_ext.koplugin", "JoeBumm/Koreader-Menu-customizer", "AnthonyGress/zen_ui.koplugin"]
say = "SimpleUI Ext extends SimpleUI specifically. Menu Customizer hides menus and plugins. Zen UI replaces the interface with a minimal one. Three different jobs, not three ways to do one."
