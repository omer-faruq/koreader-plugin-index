# ---------------------------------------------------------------- distinctions
#
# Pairs that look interchangeable and are not.
#
# Write these as plain description, for a person deciding between the two. They
# are shown in the UI as well as copied into the generated knowledge base, and
# instructions aimed at a model ("do not describe them as...") read badly to a
# reader. The rules a model needs belong in the knowledge base preamble; what
# belongs here is the fact that distinguishes them.

[[distinctions]]
between = ["gitalexcampos/highlightsync.koplugin", "dani84bs/AnnotationSync.koplugin"]
say = "Both synchronise annotations, and they are not interchangeable. Which one fits depends on the sync service you already use."

[[distinctions]]
between = ["omer-faruq/assistant.koplugin", "zeeyado/koassistant.koplugin"]
say = "Related projects in the same ecosystem, but separate repositories with separate authors and features."

[[distinctions]]
between = ["omer-faruq/webbrowser.koplugin", "iceyear/readeck.koplugin"]
say = "The browser searches and reads pages directly. Readeck is an integration with a Readeck server you already run, so it is a read-later workflow rather than a browser."

[[distinctions]]
between = ["omer-faruq/simpleui_ext.koplugin", "doctorhetfield-cmd/simpleui.koplugin", "JoeBumm/Koreader-Menu-customizer", "AnthonyGress/zen_ui.koplugin", "Euphoriyy/appearance.koplugin", "kristianpennacchia/zzz-readermenuredesign.koplugin"]
say = "SimpleUI Ext adds modules to SimpleUI and needs it installed. Menu Customizer hides entries from the menus you already have. The last three change how KOReader looks without replacing the home screen, and they reach different parts of it: Zen UI strips the interface back to the page, Appearance gathers the look-and-feel settings into one place, and Reader Menu Redesign restyles the menus you meet while reading, the highlight menu and the dictionary popup among them. Different jobs, not competing versions of one."

[[distinctions]]
between = ["doctorhetfield-cmd/simpleui.koplugin", "AndyHazz/bookshelf.koplugin"]
say = "Both replace the home screen and you would install one, not both. SimpleUI is a whole minimal interface with its own navigation and status bars; Bookshelf is a library browser that leads with covers, series and progress."

[[distinctions]]
between = ["omer-faruq/appstore.koplugin", "ultimatejimmy/storefront.koplugin", "advokatb/updatesmanager.koplugin"]
say = "Three ways to install and update from the device, and only two of them browse anything. AppStore and Storefront both show a catalogue you can install from -- Storefront began as a fork of AppStore and has since gone its own way, adding fonts, screensavers and a versions tab. Updates Manager has no catalogue at all: it watches the repositories you name for newer versions of what you already have, and installs those."

[[distinctions]]
between = ["ZlibraryKO/zlibrary.koplugin", "OctoNezd/zlibrary.koplugin"]
say = "Two independent Z-Library clients by different authors, not versions of one project."

[[distinctions]]
between = ["stradichenko/audiobook.koplugin", "naleo/audiobookshelf.koplugin"]
say = "Both can reach an Audiobookshelf server, so the names are not the difference. Audiobookshelf is a library client and nothing else: browse the server, download books. Audiobook is a listening plugin -- text-to-speech read-along with the spoken word highlighted on the page, plus playback of audio files -- and its server support is one source among several."

[[distinctions]]
between = ["ultimatejimmy/xray.koplugin", "Shac0x/charactertracker.koplugin"]
say = "Both follow characters through a book, and they get there differently. X-Ray reads the book with an AI provider you supply and builds the entries and timelines for you. Character Tracker asks for no provider at all: you add each character, alias and relationship yourself as you meet them, and it underlines those names in the text from then on."

[[distinctions]]
between = ["Shac0x/charactertracker.koplugin", "Arararararagi/charactertracker.koplugin"]
say = "The same plugin under the same name: Arararararagi's is a fork of Shac0x's. The fork adds pinning, sorting and search, a per-character underline opt-out, and occurrence counts with first and last appearance; the original is the one almost everyone has installed."

[[distinctions]]
between = ["omer-faruq/rssreader.koplugin", "qewer33/quickrss.koplugin"]
say = "Two standalone RSS readers, and where your feeds live decides between them. RSS Reader signs in to an aggregator -- CommaFeed, FreshRSS, Miniflux, NewsBlur or a Fever API -- so read state, stars and folders follow you between devices; it also reads a local feed list. QuickRSS keeps everything on the device: it fetches the feeds itself, tracks read and unread locally, caches the images, and pulls in the full article when a feed publishes only a summary."

[[distinctions]]
between = ["qewer33/quickrss.koplugin", "FadedSwatz/quickrss.koplugin"]
say = "Same name, and only one of them is the plugin people mean. qewer33's is the RSS reader described everywhere else in this catalogue. FadedSwatz's carries the identical name and the identical one-line description, but its README is written for a Windows desktop program and every download it offers is a zip committed inside the repository. If you were looking for QuickRSS, qewer33's is the one."

[[distinctions]]
between = ["iceyear/readeck.koplugin", "flip-rossi/readeck.koplugin"]
say = "Two independent clients for the same Readeck server, by different authors, not versions of one project. iceyear's is the fuller read-later workflow. flip-rossi's is smaller and its own README calls it early development: browse bookmarks and collections, and save a link you tap while reading."

[[distinctions]]
between = ["JorgeTheFox/koreader-dynamic-panelzoom", "Shac0x/maximum.koplugin"]
say = "Both magnify part of a comic page, and they differ in how they decide what to magnify. Dynamic Panel Zoom finds the actual panels as you read and steps through them one at a time. Maximum does not look at the artwork: it splits the page into four fixed quadrants you zoom by two-finger tap, and adds rotation and splitting for landscape pages."

[[distinctions]]
between = ["KORComic/comicreader.koplugin", "tachibana-shin/rakuyomi"]
say = "Comic Reader improves how paged comics are displayed; Rakuyomi fetches manga from online sources. One is a reading experience, the other is where the content comes from."

[[distinctions]]
between = ["finlater/weread.koplugin", "miumiupy98-art/miuread-koreader", "miumiupy98-art/weread.koplugin-fixed", "Mr54233/pickthought.koplugin"]
say = "Four ways to WeChat Reading, three of them from one root. finlater's is that root -- it reads the service inside KOReader with progress and reading time synced back -- and the repository was once named QiuYukang/weread.koplugin, which is why its descendants credit a name GitHub no longer answers to. Both of miumiupy98-art's descend from it: the -fixed fork is a modest enhancement that leads with exporting books to EPUB, optionally carrying highlights and thoughts, while MiuRead began as a modified copy of an early version and has been rebuilt well past it, with stable and beta release channels and over-the-air updates. Of those two, MiuRead is the one still being worked on. PickThought does not read the service at all: it takes highlights and public thoughts and injects them into an EPUB you already have."

[[distinctions]]
between = ["Merpyzf/pinyinime.koplugin", "gytwo/pinyin_enhancement.koplugin", "zhouwt/pinyin.koplugin"]
say = "One word, three plugins: two for typing Chinese and one for reading it. Pinyin IME is the deeper of the two typists -- a full word list, whole-sentence input, five double-pinyin schemes and personalised learning, all offline. Pinyin Enhancement is the lighter one: a candidate bar over KOReader's own pinyin keyboard, ordered by how often you pick a word, with extra dictionaries you can add yourself. Pinyin for KOReader types nothing at all; it prints pinyin above the characters on the page as you read."


# ------------------------------------------------------------------- discovery
#
# Repositories that are real plugins and that no discovery query can reach: no
# `koreader-plugin` topic, no ".koplugin" in the name. They are not tier C,
# they are absent. Widening the queries was decided against on the patch side
# already -- classification by file shape misfiles things, and this catalogue
# is worth something only while its classifications hold.
#
# Naming one here is judgement about where to look, nothing more. Every fact
# still comes from extraction and the tier is earned the same way as everyone
# else's. A seed that has been deleted or renamed warns and is skipped, on
# every run: one stranger's repository must not brick the nightly build.
#
# The cheaper fix, per seed, is an issue on the repository asking its author to
# add the `koreader-plugin` topic; when they do, the line here can go. This
# list is for the gap in between, and for authors who never answer.

[discovery]
extra_plugins = [
  # main.lua and _meta.lua at the root, MIT licensed, no topics, no description.
  "iamnotwassim/focusruler",
]
