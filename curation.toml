# ---------------------------------------------------------------- distinctions
#
# Pairs that look interchangeable and are not. Surfaced in the UI and copied
# into the generated knowledge base so a model recommending from this data is
# told the difference rather than left to guess it.

[[distinctions]]
between = ["gitalexcampos/highlightsync.koplugin", "dani84bs/AnnotationSync.koplugin"]
say = "Both synchronise annotations, and they are not interchangeable. Which one fits depends on the sync service already in use. Do not describe them as having identical capabilities."

[[distinctions]]
between = ["omer-faruq/assistant.koplugin", "zeeyado/koassistant.koplugin"]
say = "Related projects in the same ecosystem, but different repositories. Do not treat them as the same plugin."

[[distinctions]]
between = ["omer-faruq/webbrowser.koplugin", "iceyear/readeck.koplugin"]
say = "The browser is for searching and reading pages directly; Readeck is an integration with a Readeck server. A browser is not a read-later service."

[[distinctions]]
between = ["omer-faruq/simpleui_ext.koplugin", "JoeBumm/Koreader-Menu-customizer", "AnthonyGress/zen_ui.koplugin"]
say = "SimpleUI Ext extends SimpleUI specifically; Menu Customizer hides menus and plugins; Zen UI is a minimal interface. Explain the difference rather than offering them as alternatives to each other."
