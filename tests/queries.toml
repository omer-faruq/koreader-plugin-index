# Known question / answer pairs, seeded from the "Recommendation Examples"
# section of the hand-written AppStore knowledge base. That section was already
# written as query -> expected-plugin pairs, which makes it a ready-made
# regression suite for ranking.
#
# The build fails when an expected answer falls out of the top three. Add a
# case whenever a recommendation comes out wrong: that is how the ranking gets
# tuned by measurement rather than by guessing.
#
# The owner in an id is incidental. Nothing here is a claim about who hosts a
# plugin -- only about which plugin should win -- so when an id stops existing
# the suite looks for the same name under whatever owner has it now, and only
# skips the case when nothing of that name is left anywhere. This build runs
# unattended: a stranger deleting their repository must not be able to stop the
# site from publishing.

[[case]]
query = "I want AI help while reading"
expect_top3 = ["omer-faruq/assistant.koplugin"]

[[case]]
query = "read websites on my e-reader"
expect_top3 = ["omer-faruq/webbrowser.koplugin"]

[[case]]
query = "sync my highlights between devices"
expect_top3 = ["gitalexcampos/highlightsync.koplugin"]

[[case]]
query = "keep annotations synchronised across devices"
expect_top3 = ["dani84bs/AnnotationSync.koplugin", "gitalexcampos/highlightsync.koplugin"]

[[case]]
query = "Anki integration for vocabulary"
expect_top3 = ["Ajatt-Tools/anki.koplugin"]

[[case]]
query = "access my Zotero library"
expect_top3 = ["stelzch/zotero.koplugin"]

[[case]]
query = "browse an OPDS ebook catalog"
expect_top3 = ["greywolf1499/opds_plus.koplugin"]

[[case]]
query = "customise the SimpleUI homescreen"
expect_top3 = ["omer-faruq/simpleui_ext.koplugin"]

[[case]]
query = "hide menus and simplify the interface"
expect_top3 = ["JoeBumm/Koreader-Menu-customizer", "AnthonyGress/zen_ui.koplugin"]

[[case]]
query = "wireless file transfer without cables"
expect_top3 = ["kaikozlov/localsend.koplugin"]

[[case]]
query = "save web articles to read later"
expect_top3 = ["iceyear/readeck.koplugin"]

[[case]]
query = "read manga and comics"
expect_top3 = ["tachibana-shin/rakuyomi"]

[[case]]
query = "translate text while reading"
expect_top3 = ["omer-faruq/assistant.koplugin"]

[[case]]
query = "handwritten notes with a stylus"
expect_top3 = ["mysticknits/pencil.koplugin"]

[[case]]
query = "text overlays on the reading screen"
expect_top3 = ["AndyHazz/bookends.koplugin"]

# Two plugins that document themselves in Chinese, asked for in English. Both
# scored zero here until curation gave them an English purpose -- the first is
# among the most-starred plugins in the catalogue and was unreachable by any
# query in any language. These cases are the regression guard for that whole
# class: if the English view of a non-English README stops working, or a
# curated purpose is lost, they go red.

[[case]]
query = "read wechat reading books"
expect_top3 = ["finlater/weread.koplugin", "miumiupy98-art/weread.koplugin-fixed"]

[[case]]
query = "chinese web novels"
expect_top3 = ["hesan1232/fanqie.koplugin", "pengcw/legado.koplugin"]

# Someone who already knows the name and types it. Every case below put the
# plugin that is *called* this outside the top three -- most of them nowhere in
# the results at all -- because a name like `readingstreak.koplugin` is one
# indexed word that "streak" cannot reach, and `reading` is a stopword. Which
# is the worst way to lose a user: they typed the right thing, saw a list
# without it, and concluded the catalogue does not have it.

[[case]]
query = "reading streak"
expect_top3 = ["advokatb/readingstreak.koplugin"]

[[case]]
query = "reading list"
expect_top3 = ["maxcaplan/readinglist.koplugin"]

[[case]]
query = "page turner"
expect_top3 = ["TomasDiLeo/pageturner.koplugin"]

[[case]]
query = "quick settings"
expect_top3 = ["renandeivison/quicksettings"]

[[case]]
query = "folder memory"
expect_top3 = ["Craftwork2720/foldermemory.koplugin"]
