<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png. The services that read og:image want a raster file, so
       this is the editable original and og.png next to it is what ships; render
       this at 1200x630 whenever the wording changes.

       Deliberately no plugin count and no date. The card would be wrong within
       a night, and unlike everything else here it is not regenerated by the
       build: a number nobody rebuilds is a number that lies.

       Everything sits inside a 100px margin: some clients crop this to a
       square or to 2:1, and the title has to survive both. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3d34"/>
      <stop offset="1" stop-color="#12211d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- A quiet accent edge rather than a border: it survives the crop and gives
       the card an edge against a dark chat background, where a flat dark
       rectangle otherwise dissolves into the page. -->
  <rect x="0" y="0" width="10" height="630" fill="#7fc0aa"/>

  <!-- The favicon mark, at the size it is actually legible. -->
  <g transform="translate(100 92) scale(2.1)">
    <path d="M2 5.5h13M2 11h9" stroke="#7fc0aa" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <circle cx="17" cy="12" r="8.5" fill="none" stroke="#ffffff" stroke-width="3.2"/>
    <path d="M23.5 18.5l7 7" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="100" y="300" fill="#ffffff" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="700" letter-spacing="-2">KOReader Plugin Finder</text>

  <text x="100" y="376" fill="#cfe3da" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="400">Describe what you want to do.</text>
  <text x="100" y="428" fill="#cfe3da" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="400">Not what the plugin is called.</text>

  <rect x="100" y="486" width="150" height="3" fill="#7fc0aa" opacity=".6"/>

  <text x="100" y="545" fill="#8faea2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400" fill-opacity=".85">Community plugins and user patches, indexed nightly</text>
</svg>
