name: Build index

# Two cadences. The daily run asks GitHub only for repositories pushed since
# last time and carries everything else over from the published index, which
# costs roughly ten requests. The monthly run rebuilds from scratch to catch
# what a diff cannot see: deleted repositories, removed topics, and entries
# that need reprocessing after the extraction rules or curation.toml changed.
on:
  # Not on the hour. GitHub's scheduler is best-effort and the top of the hour
  # is the most contended minute there is, so a run booked at :00 routinely
  # waits. An odd minute gets picked up closer to the time asked for.
  schedule:
    - cron: "23 3 * * *"    # daily, diff
    - cron: "23 4 1 * *"    # 1st of the month, full
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        options: [diff, full]
        default: full

# `contents: write` is for the monthly heartbeat commit below, nothing else.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let a monthly full run and a daily diff publish over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Majors pinned to the Node 24 releases. The Node 20 ones still ran, but
      # on a forced runtime and with a deprecation notice, and this workflow
      # runs unattended every night -- not somewhere to leave a warning that
      # turns into an error on someone else's schedule.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # tomllib is stdlib from 3.11; nothing to install

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 4 1 * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=diff" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Quality tests
        run: python scripts/test_queries.py

      # That suite now also refuses a catalogue that can no longer be searched,
      # which is a failure the ranking cases cannot see: an entry scoring zero
      # against every query appears in none of them. A gate that has never been
      # watched trip is indistinguishable from no gate, so its thresholds are
      # exercised directly against synthetic indexes.
      - name: Coverage gate
        run: python tests/coverage_gate.py

      # build_plugin decides what a README becomes, and handles four shapes of
      # document differently with a fallback behind each. Nothing else covers
      # it: the query suite reads a finished index and cannot see how a field
      # was arrived at.
      - name: README shapes
        run: python tests/readme_shapes.py

      # The page reimplements rank.py in JavaScript. If they drift, the quality
      # suite keeps passing while users see different results.
      - name: Ranking parity
        run: python tests/parity_check.py

      # AI Mode spends the reader's own API key, and how much of it goes on a
      # question is decided entirely in the page. Nothing else here can see
      # that, so it is driven against a scripted model.
      - name: AI Mode flow
        run: node tests/ai_flow.mjs

      # A list copied out of the results is read somewhere nobody here can
      # see, so what it carries has to be pinned down where it is built.
      - name: Shared list
        run: node tests/share_list.mjs

      # 46 lines nobody here can proofread by reading the page, shown on the
      # strength of a header. Coverage and direction are checkable; the prose
      # is not, so at least these are.
      - name: Welcome line
        run: node tests/welcome.mjs

      # The heartbeat. GitHub disables a scheduled workflow after 60 days
      # without repository activity, and nothing here ever commits -- the
      # index is a Pages artifact, deliberately not checked in. So this repo
      # would stop building itself two months after the last hand edit, with
      # only a notification e-mail to say so.
      #
      # The monthly full run writes its own numbers back into the README
      # instead. Twelve commits a year, each carrying the count and the
      # rebuild date a reader wants at the top of the page anyway, and the
      # 60-day clock never gets closer than thirty days to running out.
      # Pushing with GITHUB_TOKEN does not trigger workflows, so this cannot
      # loop.
      - name: Heartbeat commit
        if: steps.mode.outputs.mode == 'full'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README status block unchanged; nothing to commit"
          else
            git commit -m "index: full rebuild $(date -u +%Y-%m-%d)"
            git push
          fi

      # Published as an artifact rather than committed. Committing generated
      # JSON every night would bloat the history, and a nightly commit would
      # register as a release to anything watching the repository. The
      # heartbeat above is the one exception, and it is monthly and four lines.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
